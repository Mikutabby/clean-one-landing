<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEAN//ONE - Información</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logo.png">
    <style>
        :root {
            --bg-primary: #06060b;
            --bg-secondary: #0d0d14;
            --bg-card: #13131d;
            --text-primary: #f8f9fa;
            --text-secondary: #9ca3af;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --border-subtle: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
        }

        ::selection {
            background: rgba(0, 212, 255, 0.3);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 0;
            background: rgba(6, 6, 11, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            text-decoration: none;
        }

        .nav-logo-img {
            height: 40px;
            width: auto;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-back:hover {
            color: var(--accent-primary);
        }

        .nav-back svg {
            width: 18px;
            height: 18px;
        }

        /* Content */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 120px 24px 80px;
        }

        .content-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }

        .content-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .content-title .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .content-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 48px;
            line-height: 1.7;
        }

        .content-section {
            margin-bottom: 40px;
        }

        .content-section h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .content-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-primary);
        }

        .content-section p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .content-section ul {
            list-style: none;
            margin-bottom: 16px;
        }

        .content-section ul li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .content-section ul li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-primary);
            font-weight: 700;
        }

        .highlight-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            margin: 24px 0;
        }

        .highlight-box.accent {
            border-color: rgba(0, 212, 255, 0.3);
        }

        .highlight-box p {
            margin-bottom: 0;
        }

        /* Contact Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 24px 0;
        }

        .contact-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
        }

        .contact-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .contact-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .contact-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .contact-card a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            padding: 32px 0;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
        }

        .footer p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                padding: 100px 16px 60px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

                content: `

                        <p>Recopilamos información que nos proporcionas directamente al realizar una compra o contactarnos:</p>

                        </div>

                    <div class="content-section">

                            <li>Ser informado sobre el uso de tus datos</li>
                            <li>Revocar la autorización y/o solicitar la supresión de tus datos</li>

                    <div class="content-section">
                        <h2>7. Retención de Datos</h2>
                        <p>Conservamos tu información personal solo durante el tiempo necesario para los fines para los que fue recopilada, o según lo requiera la ley.</p>

                    <div class="content-section">

                        <p>Si tienes preguntas sobre esta política de privacidad o sobre el manejo de tus datos personales, puedes contactarnos a través de nuestros canales de soporte.</p>
                    </div>

                    <div class="highlight-box">
                        <p><strong>Última actualización:</strong> 1 de Septiembre de 2026</p>

            },

            contacto: {
                badge: 'Contacto',
                title: 'Hablemos <span class="gradient-text">Juntos</span>',
                subtitle: '¿Tienes alguna pregunta, sugerencia o necesitas ayuda? Estamos aquí para ti.',
                content: `
                    <div class="contact-grid">
                        <div class="contact-card">
                            <div class="contact-icon">📧</div>
                            <h3>Email</h3>
                            <p><a href="mailto:soporte@cleanone.com">soporte@cleanone.com</a></p>
                            <p>Respuesta en 24 horas</p>

                        <div class="contact-card">

                        Sábado: 9:00 AM - 1:00 PM<br>

            soporte: {

                title: 'Centro de <span class="gradient-text">Soporte</span>',
                subtitle: 'Encuentra respuestas a tus preguntas frecuentes o contacta con nuestro equipo de soporte.',
                content: `
                    <div class="content-section">
                        <h2>Preguntas Frecuentes</h2>
                        
                        <h3>¿Cómo limpio correctamente mi kit CLEAN//ONE?</h3>
                        <p>Para obtener los mejores resultados:</p>
                        <ul>
                            <li>Aplica el spray de limpieza directamente sobre la superficie o en un paño de microfibra</li>
                            <li>Frota suavemente con movimientos circulares</li>
                            <li>Utiliza el cepillo de cerdas suaves para eliminar el polvo de las áreas difíciles</li>
                            <li>Para audífonos, usa la herramienta especializada con cuidado</li>

                        <h3>¿El kit es seguro para todos mis dispositivos?</h3>

                            <li>Monitores y pantallas</li>
                        </ul>

                        <p>El spray de limpieza de 30ml dura aproximadamente 3 meses de uso regular (limpiando tus dispositivos 2-3 veces por semana). Las herramientas físicas (cepillos, paños) duran años con el cuidado adecuado.</p>
                    </div>

                    <div class="highlight-box accent">

                        <p>Si tu producto llegó con algún daño, contáctanos dentro de las primeras 48 horas con photos del daño y tu número de pedido. Te enviaremos un reemplazo sin costo adicional.</p>
                    </div>

                    <div class="content-section">

                    <div class="highlight-box">

        // Get section from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const section = urlParams.get('section');

        // Load content
        const contentEl = document.getElementById('content');
        
        if (section && sections[section]) {
            const data = sections[section];
            document.title = `CLEAN//ONE - ${data.badge}`;
            
            contentEl.innerHTML = `
                <div class="content-badge">${data.badge}</div>
                <h1 class="content-title">${data.title}</h1>
                <p class="content-subtitle">${data.subtitle}</p>
                ${data.content}
            `;
        } else {
            // Default: redirect to terminos
            window.location.search = 'section=terminos';
        }
